<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="theme-color" content="#4f46e5">
  <title>פורטל התלמידים | MathBoost</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://math-crm.onrender.com" crossorigin>
  <style>
    :root {
      color-scheme: light;
      font-family: "Heebo", Arial, sans-serif;
      background: #f8fafc;
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
    }

    .portal-frame {
      display: block;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      border: 0;
      background: #f8fafc;
    }

    .loading {
      position: fixed;
      inset: 0;
      z-index: 2;
      display: grid;
      place-items: center;
      padding: 24px;
      color: #0f172a;
      background:
        radial-gradient(circle at 18% 15%, rgba(124, 58, 237, .20), transparent 34%),
        radial-gradient(circle at 85% 85%, rgba(79, 70, 229, .14), transparent 32%),
        linear-gradient(145deg, #eef2ff, #f8fafc 55%, #f5f3ff);
      transition: opacity .25s ease, visibility .25s ease;
    }

    .loading.is-hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .loading-card {
      width: min(420px, 100%);
      padding: 36px 28px;
      text-align: center;
      border: 1px solid rgba(129, 140, 248, .24);
      border-radius: 26px;
      background: rgba(255, 255, 255, .90);
      box-shadow: 0 24px 70px rgba(79, 70, 229, .16);
      backdrop-filter: blur(12px);
    }

    .brand {
      font-size: 28px;
      font-weight: 900;
      color: #3730a3;
      letter-spacing: -.02em;
    }

    .subtitle {
      margin-top: 6px;
      color: #64748b;
      font-size: 15px;
      font-weight: 600;
    }

    .spinner {
      width: 40px;
      height: 40px;
      margin: 24px auto 0;
      border: 4px solid #e0e7ff;
      border-top-color: #7c3aed;
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    @media (prefers-reduced-motion: reduce) {
      .spinner { animation-duration: 1.6s; }
      .loading { transition: none; }
    }
  </style>
</head>
<body>
  <div id="loading" class="loading" role="status" aria-live="polite">
    <div class="loading-card">
      <div class="brand">MathBoost</div>
      <div class="subtitle">סביבת הלמידה שלך נטענת כעת</div>
      <div class="spinner" aria-hidden="true"></div>
    </div>
  </div>

  <iframe
    id="student-portal"
    class="portal-frame"
    src="https://math-crm.onrender.com/student"
    title="פורטל התלמידים של MathBoost"
    allow="clipboard-read; clipboard-write"
    referrerpolicy="strict-origin"
  ></iframe>

  <script>
    const frame = document.getElementById('student-portal');
    const loading = document.getElementById('loading');
    frame.addEventListener('load', () => loading.classList.add('is-hidden'), { once: true });
  </script>
</body>
</html>
