<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>MathBoost — משחקי כיתה</title>
<style>
:root{
  --bg:#F7F8FA; --surface:#FFFFFF; --text:#1E293B; --text-soft:#64748B;
  --border:#E5E7EB; --green:#10B981; --green-dark:#0B815A; --blue:#1CB0F6; --blue-dark:#0E86C2;
  --amber:#F59E0B; --red:#EF4444; --purple:#A570FF; --pink:#CC348D;
  --radius:16px; --radius-sm:10px; --shadow:0 4px 16px rgba(0,0,0,0.07);
  --shadow-lg:0 12px 32px rgba(0,0,0,0.12);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg); color:var(--text);
  font-family:'Rubik','Heebo','Segoe UI','Arial Hebrew',sans-serif;
  line-height:1.6; min-height:100vh; -webkit-font-smoothing:antialiased;
}
.ltr-num{direction:ltr; unicode-bidi:isolate; display:inline-block; font-feature-settings:"tnum";}
.wrap{max-width:1180px; margin:0 auto; padding:20px;}
.hidden{display:none !important;}
button{font-family:inherit; cursor:pointer; border:none; background:none;}
h1,h2,h3{margin:0; font-weight:800;}

/* ---------- Header ---------- */
.topbar{
  display:flex; align-items:center; justify-content:space-between;
  padding:14px 22px; background:var(--surface); border-bottom:1px solid var(--border);
  position:sticky; top:0; z-index:50;
}
.brand{display:flex; align-items:center; gap:10px; font-weight:800; font-size:20px;}
.brand .logo{
  width:38px; height:38px; border-radius:11px; display:flex; align-items:center; justify-content:center;
  background:linear-gradient(135deg,var(--green),var(--blue)); color:#fff; font-size:20px;
}
.topbar-actions{display:flex; align-items:center; gap:10px;}
.icon-btn{
  width:40px; height:40px; border-radius:12px; background:var(--bg); border:1px solid var(--border);
  display:flex; align-items:center; justify-content:center; font-size:18px; transition:.15s;
}
.icon-btn:hover{background:#EEF2F6;}

/* ---------- Buttons ---------- */
.btn{
  display:inline-flex; align-items:center; gap:8px; justify-content:center;
  padding:13px 22px; border-radius:var(--radius-sm); font-weight:800; font-size:16px;
  color:#fff; background:var(--green); box-shadow:0 4px 0 var(--green-dark);
  transition:transform .08s;
}
.btn:active{transform:translateY(3px); box-shadow:0 1px 0 var(--green-dark);}
.btn.secondary{background:var(--surface); color:var(--text); border:2px solid var(--border); box-shadow:0 4px 0 var(--border);}
.btn.blue{background:var(--blue); box-shadow:0 4px 0 var(--blue-dark);}
.btn.big{padding:18px 30px; font-size:19px; border-radius:14px;}
.btn:disabled{opacity:.5; pointer-events:none;}

/* ---------- Home / grade picker ---------- */
.hero{text-align:center; padding:40px 20px 24px;}
.hero h1{font-size:38px; color:var(--text);}
.hero p{color:var(--text-soft); font-size:17px; margin-top:8px;}
.grade-grid{
  display:grid; grid-template-columns:repeat(6,1fr); gap:14px; max-width:980px; margin:0 auto;
}
@media(max-width:760px){.grade-grid{grid-template-columns:repeat(3,1fr);}}
.grade-card{
  background:var(--surface); border:2px solid var(--border); border-radius:var(--radius);
  padding:26px 10px; text-align:center; box-shadow:var(--shadow); transition:.15s;
}
.grade-card:hover{border-color:var(--green); transform:translateY(-3px); box-shadow:var(--shadow-lg);}
.grade-card .letter{font-size:34px; font-weight:800; color:var(--green-dark);}
.grade-card .sub{font-size:12px; color:var(--text-soft); margin-top:4px; font-weight:700;}

/* ---------- Game grid screen ---------- */
.grade-header{display:flex; align-items:center; justify-content:space-between; margin-bottom:18px; flex-wrap:wrap; gap:10px;}
.grade-header h2{font-size:28px;}
.level-bar{display:flex; align-items:center; gap:8px; margin:0 0 18px; flex-wrap:wrap;}
.level-bar .level-label{font-weight:800; font-size:14px; color:var(--text-soft);}
.level-btn{
  border:2px solid #E2E8F0; background:#fff; border-radius:999px;
  padding:7px 16px; font-family:inherit; font-size:14px; font-weight:800;
  color:var(--text-soft); cursor:pointer; transition:all .15s;
}
.level-btn:hover{border-color:#94A3B8;}
.level-btn.active{background:var(--green); border-color:var(--green); color:#fff;}
.level-hint{font-size:12px; color:var(--text-soft); width:100%;}
.grade-header .count-pill{
  background:#ECFDF5; color:var(--green-dark); font-weight:800; font-size:13px;
  padding:5px 12px; border-radius:999px;
}
.game-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:14px;}
@media(max-width:1000px){.game-grid{grid-template-columns:repeat(3,1fr);}}
@media(max-width:680px){.game-grid{grid-template-columns:repeat(2,1fr);}}
.game-card{
  background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
  overflow:hidden; box-shadow:var(--shadow); text-align:right; transition:.15s; position:relative;
}
.game-card:hover{transform:translateY(-3px); box-shadow:var(--shadow-lg); border-color:#D8DEE6;}
.game-card .art{
  height:88px; display:flex; align-items:center; justify-content:center; font-size:42px;
}
.game-card .body{padding:14px;}
.game-card .name{font-weight:800; font-size:15px; margin-bottom:3px;}
.game-card .skill{font-size:12px; color:var(--text-soft); font-weight:600;}

/* ---------- Game screen shell ---------- */
.game-screen{min-height:100vh; background:var(--bg); display:flex; flex-direction:column;}
.game-topbar{
  display:flex; align-items:center; justify-content:space-between; padding:10px 18px;
  background:var(--surface); border-bottom:1px solid var(--border); flex-wrap:wrap; gap:8px;
}
.game-topbar .left, .game-topbar .right{display:flex; align-items:center; gap:10px; flex-wrap:wrap;}
.timer-pill{
  font-weight:800; font-size:18px; padding:6px 16px; border-radius:999px; background:#FFF7E6; color:#92660B;
  border:2px solid #F5D98A; min-width:70px; text-align:center;
}
.timer-pill.low{background:#FEE2E2; color:#B91C1C; border-color:#FCA5A5;}
.game-stage{
  flex:1; display:flex; align-items:center; justify-content:center; padding:24px;
}
.game-card-stage{
  width:100%; max-width:880px; background:var(--surface); border-radius:24px; box-shadow:var(--shadow-lg);
  padding:36px; text-align:center;
}
.q-prompt{font-size:30px; font-weight:800; margin-bottom:28px; line-height:1.5;}
.q-prompt .ltr-num{font-size:inherit;}
.choices-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:14px; max-width:620px; margin:0 auto;}
@media(max-width:560px){.choices-grid{grid-template-columns:1fr;}}
.choice-btn{
  padding:20px; font-size:24px; font-weight:800; border-radius:16px; background:var(--bg);
  border:2px solid var(--border); transition:.12s;
}
.choice-btn:hover{border-color:var(--blue); background:#EFF8FF;}
.choice-btn.correct{background:#DCFCE7; border-color:var(--green); color:var(--green-dark);}
.choice-btn.wrong{background:#FEE2E2; border-color:var(--red); color:#B91C1C;}
.type-answer-row{display:flex; gap:12px; justify-content:center; align-items:center; flex-wrap:wrap;}
.type-answer-row input{
  font-size:30px; font-weight:800; text-align:center; width:160px; padding:14px; border-radius:14px;
  border:2px solid var(--border); direction:ltr;
}
.type-answer-row input:focus{outline:none; border-color:var(--green);}
.feedback{margin-top:18px; font-size:18px; font-weight:800; min-height:28px;}
.feedback.ok{color:var(--green-dark);}
.feedback.bad{color:#B91C1C;}
.explain{font-size:14px; color:var(--text-soft); margin-top:6px; font-weight:600;}

/* answer judge row (buzzer template) */
.answer-judge{display:flex; gap:10px; justify-content:center;}

/* settings modal card */
.setup-card{max-width:520px; margin:40px auto; background:var(--surface); border-radius:var(--radius); padding:30px; box-shadow:var(--shadow);}
.setup-card h3{font-size:22px; margin-bottom:18px; text-align:center;}
.setting-row{display:flex; align-items:center; justify-content:space-between; padding:10px 0; border-top:1px solid var(--border); font-weight:700; font-size:14px;}
.switch{position:relative; width:46px; height:26px; border-radius:999px; background:var(--border); transition:.15s; flex-shrink:0;}
.switch.on{background:var(--green);}
.switch::after{content:'';position:absolute; top:3px; right:3px; width:20px; height:20px; border-radius:50%; background:#fff; transition:.15s; box-shadow:0 1px 3px rgba(0,0,0,.3);}
.switch.on::after{right:23px;}

/* board games */
.board-grid{display:grid; gap:10px;}
.bingo-cell, .jeopardy-cell{
  background:var(--bg); border:2px solid var(--border); border-radius:12px; display:flex; align-items:center; justify-content:center;
  font-weight:800; font-size:18px; padding:14px; min-height:60px; transition:.12s;
}
.jeopardy-cell{cursor:pointer; background:var(--green); color:#fff; box-shadow:0 4px 0 var(--green-dark); font-size:22px;}
.jeopardy-cell.used{background:var(--border); color:var(--text-soft); box-shadow:none; cursor:default;}
.bingo-cell.marked{background:#DCFCE7; border-color:var(--green);}

/* wheel */
.wheel-wrap{display:flex; flex-direction:column; align-items:center; gap:18px;}
.wheel-canvas{filter:drop-shadow(0 8px 20px rgba(0,0,0,.18));}

/* match pairs */
.match-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:10px; max-width:680px; margin:0 auto;}
@media(max-width:560px){.match-grid{grid-template-columns:repeat(2,1fr);}}
.match-card{
  background:var(--bg); border:2px solid var(--border); border-radius:12px; padding:16px 8px; font-weight:800; font-size:16px;
  min-height:64px; display:flex; align-items:center; justify-content:center; text-align:center;
}
.match-card.selected{border-color:var(--blue); background:#EFF8FF;}
.match-card.solved{background:#DCFCE7; border-color:var(--green); opacity:.7;}

/* confetti */
#confetti-canvas{position:fixed; inset:0; pointer-events:none; z-index:9999;}

/* helper / instructions */
.help-banner{
  background:#ECFDF5; border:1px solid #A7F3D0; border-radius:14px; padding:14px 18px; font-size:14px; color:#065F46;
  margin-bottom:18px; font-weight:600; line-height:1.7;
}
.kbd{display:inline-block; background:#fff; border:1px solid #A7F3D0; border-radius:6px; padding:1px 7px; font-weight:800; font-family:monospace;}
.footer-note{text-align:center; color:var(--text-soft); font-size:12px; padding:30px 0;}
</style>
</head>
<body>

<canvas id="confetti-canvas"></canvas>

<div id="app"></div>

<script>
'use strict';
/* =========================================================================
   MathBoost — מערכת משחקי כיתה (קובץ עצמאי)
   ========================================================================= */

const GRADES = ['א','ב','ג','ד','ה','ו','ז','ח','ט','י','יא','יב'];
const GRADE_LABEL = {
  'א':'כיתה א׳','ב':'כיתה ב׳','ג':'כיתה ג׳','ד':'כיתה ד׳','ה':'כיתה ה׳','ו':'כיתה ו׳',
  'ז':'כיתה ז׳','ח':'כיתה ח׳','ט':'כיתה ט׳','י':'כיתה י׳','יא':'כיתה יא׳','יב':'כיתה יב׳'
};
const GRADE_SUBTITLE = {
  'א':'חיבור וחיסור','ב':'כפל ומבוא','ג':'לוח הכפל','ד':'שברים ועשרוני','ה':'אחוזים ויחס','ו':'מספרים מכוונים',
  'ז':'אלגברה ומשוואות','ח':'פונקציה קווית','ט':'פונקציה ריבועית','י':'טריגונומטריה','יא':'נגזרות ולוגריתם','יב':'חדו"א ווקטורים'
};

/* ---------------------------------------------------------------------- */
/* Utility: numbers / formatting                                          */
/* ---------------------------------------------------------------------- */
function ri(min,max){ return Math.floor(Math.random()*(max-min+1))+min; }
function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
function shuffle(arr){ const a=arr.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a; }
function gcd(a,b){ a=Math.abs(a); b=Math.abs(b); while(b){[a,b]=[b,a%b];} return a||1; }
function fmtFrac(n,d){ const g=gcd(n,d); n/=g; d/=g; if(d<0){n=-n;d=-d;} return d===1? String(n) : (n+'/'+d); }
function fmtNum(x){
  if(!isFinite(x)) return '—';
  if(Math.abs(x)<1e-9) x=0;
  const r = Math.round(x*1000)/1000;
  return (Object.is(r,-0)?0:r).toString();
}
function ltr(html){ return '<span class="ltr-num">'+html+'</span>'; }
function parseFracOrPct(s){
  s = String(s).trim().replace(/\s/g,'');
  const isPercent = s.includes('%');
  s = s.replace('%','');
  let val;
  if(s.includes('/')){ const parts=s.split('/'); val = parts.length===2? parseFloat(parts[0])/parseFloat(parts[1]) : NaN; }
  else val = parseFloat(s);
  return isPercent ? val/100 : val;
}

/* ---------------------------------------------------------------------- */
/* Sound (Web Audio, no external files)                                   */
/* ---------------------------------------------------------------------- */
const Sound = (function(){
  let ctx=null; let enabled=true;
  function ensure(){ if(!ctx){ try{ ctx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } return ctx; }
  function tone(freq,dur,type='sine',vol=.18){
    if(!enabled) return; const c=ensure(); if(!c) return;
    const o=c.createOscillator(), g=c.createGain();
    o.type=type; o.frequency.value=freq; g.gain.value=vol;
    o.connect(g); g.connect(c.destination);
    const t=c.currentTime; o.start(t); g.gain.exponentialRampToValueAtTime(.001,t+dur); o.stop(t+dur+.02);
  }
  return {
    setEnabled(v){ enabled=v; },
    isEnabled(){ return enabled; },
    correct(){ tone(660,.12); setTimeout(()=>tone(880,.16),90); },
    wrong(){ tone(160,.25,'sawtooth',.12); },
    tick(){ tone(900,.05,'square',.05); },
    click(){ tone(500,.05,'square',.06); },
    win(){ [523,659,784,1046].forEach((f,i)=>setTimeout(()=>tone(f,.18),i*110)); },
  };
})();

/* ---------------------------------------------------------------------- */
/* Confetti                                                                */
/* ---------------------------------------------------------------------- */
const Confetti = (function(){
  const canvas=document.getElementById('confetti-canvas');
  const ctx=canvas.getContext('2d');
  let particles=[]; let running=false;
  function resize(){ canvas.width=innerWidth; canvas.height=innerHeight; }
  window.addEventListener('resize',resize); resize();
  const colors=['#10B981','#1CB0F6','#F59E0B','#A570FF','#CC348D','#EF4444'];
  function burst(x,y,n=60){
    for(let i=0;i<n;i++){
      particles.push({
        x: x ?? canvas.width/2, y: y ?? canvas.height/3,
        vx:(Math.random()-.5)*9, vy: Math.random()*-9-2, g:.32,
        size: 4+Math.random()*5, color: pick(colors), rot: Math.random()*360, vr:(Math.random()-.5)*14, life: 70+Math.random()*30
      });
    }
    if(!running){ running=true; loop(); }
  }
  function loop(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    particles.forEach(p=>{
      p.x+=p.vx; p.y+=p.vy; p.vy+=p.g; p.rot+=p.vr; p.life--;
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.rot*Math.PI/180);
      ctx.fillStyle=p.color; ctx.fillRect(-p.size/2,-p.size/2,p.size,p.size*.6);
      ctx.restore();
    });
    particles=particles.filter(p=>p.life>0 && p.y<canvas.height+50);
    if(particles.length){ requestAnimationFrame(loop); } else { running=false; ctx.clearRect(0,0,canvas.width,canvas.height); }
  }
  return { burst };
})();

/* ---------------------------------------------------------------------- */
/* App state                                                              */
/* ---------------------------------------------------------------------- */
const State = {
  grade: null,
  settings: { sound:true, timerOn:true, fx:true, level:'normal' },
  activeGameId: null,
  activeUnmount: null,
};

/* ---------------------------------------------------------------------- */
/* Difficulty levels — affect BOTH the per-question timer and the numeric  */
/* ranges the shared generators draw from. Applied at question-generation  */
/* time (not at CURRICULUM definition), so switching level takes effect    */
/* on the very next question.                                              */
/* ---------------------------------------------------------------------- */
const LEVELS = {
  easy:   { label:'🐢 רגוע',  timeFactor:1.8, rangeFactor:0.7 },
  normal: { label:'⏱️ רגיל',  timeFactor:1,   rangeFactor:1 },
  hard:   { label:'⚡ אתגר',  timeFactor:0.6, rangeFactor:1.4 },
};
function lvl(){ return LEVELS[State.settings.level] || LEVELS.normal; }
function scaleSeconds(s){ return Math.max(6, Math.round(s * lvl().timeFactor)); }
function scaleRange(max, floor){ return Math.max(floor || 5, Math.round(max * lvl().rangeFactor)); }

function loadSettings(){
  try{
    const raw = localStorage.getItem('mb_games_settings');
    if(raw){ Object.assign(State.settings, JSON.parse(raw)); }
  }catch(e){}
  Sound.setEnabled(State.settings.sound);
}
function saveSettings(){
  try{ localStorage.setItem('mb_games_settings', JSON.stringify(State.settings)); }catch(e){}
}

/* ---------------------------------------------------------------------- */
/* Router                                                                  */
/* ---------------------------------------------------------------------- */
const app = document.getElementById('app');
function render(view){
  if(State.activeUnmount){ try{ State.activeUnmount(); }catch(e){} State.activeUnmount=null; }
  app.innerHTML='';
  view(app);
}

/* ---------------------------------------------------------------------- */
/* Fullscreen helper                                                       */
/* ---------------------------------------------------------------------- */
function toggleFullscreen(){
  if(!document.fullscreenElement){ document.documentElement.requestFullscreen?.().catch(()=>{}); }
  else{ document.exitFullscreen?.().catch(()=>{}); }
}

/* ---------------------------------------------------------------------- */
/* Timer component (shared)                                                */
/* ---------------------------------------------------------------------- */
function createTimer(seconds, onTick, onEnd){
  let remaining = seconds; let handle=null;
  function start(){
    stop();
    handle = setInterval(()=>{
      remaining--;
      onTick && onTick(remaining);
      if(remaining<=3 && remaining>0) Sound.tick();
      if(remaining<=0){ stop(); onEnd && onEnd(); }
    },1000);
  }
  function stop(){ if(handle){ clearInterval(handle); handle=null; } }
  function reset(s){ remaining = s ?? seconds; }
  return { start, stop, reset, get remaining(){ return remaining; } };
}

/* ---------------------------------------------------------------------- */
/* Game chrome shell — wraps every engine with topbar (score/timer/exit)  */
/* ---------------------------------------------------------------------- */
function gameShell(container, opts){
  const { title, emoji, onExit, showTimer } = opts;
  container.innerHTML =
    '<div class="game-screen">'+
      '<div class="game-topbar">'+
        '<div class="right">'+
          '<button class="icon-btn" id="gs-exit" title="חזרה">⟵</button>'+
          '<div style="font-weight:800;font-size:16px">'+ (emoji||'') +' '+ title +'</div>'+
        '</div>'+
        '<div class="left">'+
          (State.settings.timerOn && showTimer!==false ? '<div class="timer-pill" id="gs-timer">--</div>' : '')+
          '<button class="icon-btn" id="gs-sound" title="סאונד">'+(State.settings.sound?'🔊':'🔇')+'</button>'+
          '<button class="icon-btn" id="gs-full" title="מסך מלא">⛶</button>'+
        '</div>'+
      '</div>'+
      '<div class="game-stage" id="gs-stage"></div>'+
    '</div>';
  container.querySelector('#gs-exit').addEventListener('click', ()=>{ onExit && onExit(); });
  container.querySelector('#gs-full').addEventListener('click', toggleFullscreen);
  const soundBtn = container.querySelector('#gs-sound');
  soundBtn.addEventListener('click', ()=>{
    State.settings.sound = !State.settings.sound; Sound.setEnabled(State.settings.sound); saveSettings();
    soundBtn.textContent = State.settings.sound?'🔊':'🔇';
  });
  return container.querySelector('#gs-stage');
}
function setTimerDisplay(container, text, low){
  const el = container.querySelector('#gs-timer'); if(!el) return;
  el.textContent = text; el.classList.toggle('low', !!low);
}

/* ---------------------------------------------------------------------- */
/* Generic MCQ engine template                                            */
/* generator(config) -> { prompt, answer, choices, explain? }             */
/* ---------------------------------------------------------------------- */
function mountMCQTemplate(stage, config, hooks){
  let destroyed=false; let timer=null; let qIndex=0; let correctCount=0;
  const perQSeconds = scaleSeconds(config.seconds || 18);

  function nextQuestion(){
    if(destroyed) return;
    const q = config.generator();
    const choices = shuffle(q.choices);
    stage.innerHTML =
      '<div class="game-card-stage">'+
        '<div style="font-size:13px;font-weight:800;color:var(--text-soft);margin-bottom:10px">שאלה '+(++qIndex)+' · '+config.skillLabel+'</div>'+
        '<div class="q-prompt">'+q.prompt+'</div>'+
        '<div class="choices-grid">'+
          choices.map((c,i)=>'<button class="choice-btn" data-i="'+i+'">'+ltr(c)+'</button>').join('')+
        '</div>'+
        '<div class="feedback" id="mcq-fb"></div>'+
      '</div>';
    const fb = stage.querySelector('#mcq-fb');
    let answered=false;
    stage.querySelectorAll('.choice-btn').forEach((btn,i)=>{
      btn.addEventListener('click', ()=>{
        if(answered) return; answered=true; timer && timer.stop();
        const isCorrect = choices[i]===q.answer;
        btn.classList.add(isCorrect?'correct':'wrong');
        stage.querySelectorAll('.choice-btn').forEach((b2,j)=>{ if(choices[j]===q.answer) b2.classList.add('correct'); });
        if(isCorrect){ Sound.correct(); correctCount++; if(State.settings.fx) Confetti.burst(); fb.className='feedback ok'; fb.textContent='נכון! 🎉'; }
        else{ Sound.wrong(); fb.className='feedback bad'; fb.innerHTML='לא מדויק — התשובה הנכונה: '+ltr(q.answer); }
        if(q.explain) fb.innerHTML += '<div class="explain">'+q.explain+'</div>';
        setTimeout(nextQuestion, 1600);
      });
    });
    if(State.settings.timerOn && config.timed!==false){
      timer = createTimer(perQSeconds, (r)=>setTimerDisplay(stage.closest('.game-screen'), r, r<=5), ()=>{
        if(answered) return; answered=true;
        stage.querySelectorAll('.choice-btn').forEach((b2,j)=>{ if(choices[j]===q.answer) b2.classList.add('correct'); });
        Sound.wrong(); fb.className='feedback bad'; fb.innerHTML='נגמר הזמן! התשובה: '+ltr(q.answer)+(q.explain?'<div class="explain">'+q.explain+'</div>':'');
        setTimeout(nextQuestion, 1600);
      });
      timer.start();
    }
  }
  nextQuestion();
  return function unmount(){ destroyed=true; timer && timer.stop(); };
}

/* ---------------------------------------------------------------------- */
/* Type-answer engine template (numeric input)                             */
/* ---------------------------------------------------------------------- */
function mountTypeAnswerTemplate(stage, config, hooks){
  let destroyed=false; let timer=null; let qIndex=0; let streak=0; let totalScore=0;
  const perQSeconds = scaleSeconds(config.seconds || 15);
  const limitQuestions = config.count || 12;

  function nextQuestion(){
    if(destroyed) return;
    if(qIndex>=limitQuestions){ finish(); return; }
    const q = config.generator();
    stage.innerHTML =
      '<div class="game-card-stage">'+
        '<div style="font-size:13px;font-weight:800;color:var(--text-soft);margin-bottom:10px">שאלה '+(qIndex+1)+'/'+limitQuestions+' · ניקוד: <span class="ltr-num">'+totalScore+'</span></div>'+
        '<div class="q-prompt">'+q.prompt+'</div>'+
        '<div class="type-answer-row">'+
          '<input type="text" inputmode="decimal" id="ta-input" autocomplete="off">'+
          '<button class="btn" id="ta-submit">בדוק</button>'+
        '</div>'+
        '<div class="feedback" id="ta-fb"></div>'+
      '</div>';
    qIndex++;
    const input = stage.querySelector('#ta-input'); const fb=stage.querySelector('#ta-fb');
    input.focus();
    let answered=false;
    function submit(){
      if(answered) return; answered=true; timer && timer.stop();
      const val = (input.value||'').trim().replace(',', '.');
      const ok = q.check ? q.check(val) : (parseFloat(val)===q.answer);
      if(ok){ Sound.correct(); streak++; totalScore += 10 + Math.min(streak,5)*2; if(State.settings.fx) Confetti.burst();
        fb.className='feedback ok'; fb.textContent='נכון! 🎉 ('+streak+' רצף)'; }
      else{ Sound.wrong(); streak=0; fb.className='feedback bad'; fb.innerHTML='התשובה הנכונה: '+ltr(q.displayAnswer??q.answer)+(q.explain?'<div class="explain">'+q.explain+'</div>':''); }
      setTimeout(nextQuestion, 1300);
    }
    stage.querySelector('#ta-submit').addEventListener('click', submit);
    input.addEventListener('keydown', e=>{ if(e.key==='Enter') submit(); });
    if(State.settings.timerOn && config.timed!==false){
      timer = createTimer(perQSeconds, (r)=>setTimerDisplay(stage.closest('.game-screen'), r, r<=5), ()=>{
        if(answered) return; answered=true; streak=0;
        Sound.wrong(); fb.className='feedback bad'; fb.innerHTML='נגמר הזמן! התשובה: '+ltr(q.displayAnswer??q.answer)+(q.explain?'<div class="explain">'+q.explain+'</div>':'');
        setTimeout(nextQuestion, 1300);
      });
      timer.start();
    }
  }
  function finish(){
    stage.innerHTML =
      '<div class="game-card-stage">'+
        '<div style="font-size:54px;margin-bottom:10px">🏁</div>'+
        '<h2 style="font-size:26px;margin-bottom:8px">סיום!</h2>'+
        '<div style="font-size:18px;color:var(--text-soft)">ניקוד סופי: <b class="ltr-num">'+totalScore+'</b></div>'+
        '<button class="btn big" id="ta-again" style="margin-top:22px">שחק עוד סבב</button>'+
      '</div>';
    Sound.win();
    stage.querySelector('#ta-again').addEventListener('click', ()=>{ qIndex=0; streak=0; totalScore=0; nextQuestion(); });
  }
  nextQuestion();
  return function unmount(){ destroyed=true; timer && timer.stop(); };
}

/* ---------------------------------------------------------------------- */
/* Match-pairs engine template (memory / identity matching)                */
/* generator(config) -> [{id, left, right}] pairs                          */
/* ---------------------------------------------------------------------- */
function mountMatchTemplate(stage, config, hooks){
  let destroyed=false;
  const pairCount = config.pairCount || 6;
  let selected=[]; let solvedCount=0; let attempts=0;

  function build(){
    const pairs = config.generator(pairCount);
    let cards=[];
    pairs.forEach(p=>{
      cards.push({pid:p.id, text:p.left, solved:false});
      cards.push({pid:p.id, text:p.right, solved:false});
    });
    cards = shuffle(cards);
    stage.innerHTML =
      '<div class="game-card-stage">'+
        '<div style="font-size:13px;font-weight:800;color:var(--text-soft);margin-bottom:14px">'+config.skillLabel+' · התאם זוגות</div>'+
        '<div class="match-grid" id="match-grid"></div>'+
        '<div class="feedback" id="match-fb"></div>'+
      '</div>';
    const grid = stage.querySelector('#match-grid');
    cards.forEach((c,i)=>{
      const btn=document.createElement('button');
      btn.className='match-card'; btn.dataset.i=i; btn.dataset.pid=c.pid;
      btn.innerHTML = ltr(c.text);
      grid.appendChild(btn);
    });
    selected=[]; solvedCount=0; attempts=0;
    grid.querySelectorAll('.match-card').forEach(btn=>{
      btn.addEventListener('click', ()=> onPick(btn, grid, pairs.length));
    });
  }
  function onPick(btn, grid, totalPairs){
    if(btn.classList.contains('solved') || selected.includes(btn)) return;
    if(selected.length>=2) return;
    btn.classList.add('selected'); selected.push(btn);
    if(selected.length===2){
      attempts++;
      const [a,b]=selected;
      const fb = stage.querySelector('#match-fb');
      if(a.dataset.pid===b.dataset.pid && a!==b){
        a.classList.add('solved'); b.classList.add('solved');
        a.classList.remove('selected'); b.classList.remove('selected');
        solvedCount++; Sound.correct();
        fb.className='feedback ok'; fb.textContent='התאמה! ('+solvedCount+'/'+totalPairs+')';
        selected=[];
        if(solvedCount>=totalPairs){
          if(State.settings.fx) Confetti.burst(); Sound.win();
          setTimeout(()=>{
            fb.innerHTML='סיימתם בהצלחה תוך '+attempts+' ניסיונות! <button class="btn" id="match-again" style="margin-right:10px">סבב נוסף</button>';
            stage.querySelector('#match-again').addEventListener('click', build);
          },500);
        }
      } else {
        Sound.wrong(); fb.className='feedback bad'; fb.textContent='לא תואם, ננסה שוב';
        setTimeout(()=>{ a.classList.remove('selected'); b.classList.remove('selected'); selected=[]; },650);
      }
    }
  }
  build();
  return function unmount(){ destroyed=true; };
}

function mountBingoTemplate(stage, config){
  let destroyed=false;
  const size = config.size || 4;
  function buildCard(){
    let nums = shuffle(config.pool.slice());
    while(nums.length < size*size){ nums = nums.concat(shuffle(config.pool.slice())); }
    nums = nums.slice(0, size*size);
    return nums.map(n=>({n, marked:false}));
  }
  let cells = buildCard();
  let lineCount = 0;

  function renderCard(){
    stage.innerHTML =
      '<div class="game-card-stage">'+
        '<div style="font-size:13px;font-weight:800;color:var(--text-soft);margin-bottom:14px">'+config.skillLabel+' · המורה מקריא תרגיל, סמנו את התשובה</div>'+
        '<div class="board-grid" id="bingo-board" style="grid-template-columns:repeat('+size+',1fr);max-width:420px;margin:0 auto"></div>'+
        '<div style="margin-top:18px"><button class="btn blue" id="bingo-call">תרגיל הבא ←</button></div>'+
        '<div class="q-prompt" id="bingo-q" style="font-size:22px;margin-top:18px;min-height:30px"></div>'+
      '</div>';
    const board = stage.querySelector('#bingo-board');
    cells.forEach((c,i)=>{
      const d=document.createElement('div');
      d.className='bingo-cell'+(c.marked?' marked':''); d.dataset.i=i;
      d.innerHTML = ltr(c.n);
      board.appendChild(d);
    });
    board.querySelectorAll('.bingo-cell').forEach(el=>{
      el.addEventListener('click', ()=>{
        const i=+el.dataset.i; cells[i].marked=!cells[i].marked; el.classList.toggle('marked');
        checkBingo();
      });
    });
    stage.querySelector('#bingo-call').addEventListener('click', callOne);
  }
  function callOne(){
    const q = config.generator();
    const cleanPrompt = q.prompt.replace(/\s*=\s*\??\s*$/, '');
    stage.querySelector('#bingo-q').innerHTML = cleanPrompt + ' = ' + ltr('<b>'+q.answer+'</b>');
    Sound.click();
  }
  function checkBingo(){
    for(let r=0;r<size;r++){
      if(Array.from({length:size},(_,c)=>cells[r*size+c].marked).every(Boolean)){ winBingo(); return; }
    }
    for(let c=0;c<size;c++){
      if(Array.from({length:size},(_,r)=>cells[r*size+c].marked).every(Boolean)){ winBingo(); return; }
    }
  }
  function winBingo(){
    if(State.settings.fx) Confetti.burst(); Sound.win();
    const fb=document.createElement('div'); fb.className='feedback ok'; fb.textContent='בינגו!! 🎉';
    stage.querySelector('.game-card-stage').appendChild(fb);
  }
  renderCard();
  return function unmount(){ destroyed=true; };
}

/* ---------------------------------------------------------------------- */
/* Wheel-spinner template                                                  */
/* ---------------------------------------------------------------------- */
function mountWheelTemplate(stage, config){
  let destroyed=false; let spinning=false;
  const segments = config.segments; // [{label,color}]
  function draw(rotation){
    const size=320, r=size/2;
    let svg = '<svg width="'+size+'" height="'+size+'" viewBox="0 0 '+size+' '+size+'" style="transform:rotate('+rotation+'deg);transition:transform 2.2s cubic-bezier(.17,.67,.16,.99)">';
    const n=segments.length; const a = 360/n;
    for(let i=0;i<n;i++){
      const a0=(i*a)*Math.PI/180, a1=((i+1)*a)*Math.PI/180;
      const x0=r+r*Math.sin(a0), y0=r-r*Math.cos(a0);
      const x1=r+r*Math.sin(a1), y1=r-r*Math.cos(a1);
      svg += '<path d="M'+r+','+r+' L'+x0+','+y0+' A'+r+','+r+' 0 0 1 '+x1+','+y1+' Z" fill="'+segments[i].color+'"/>';
      const mid=(a0+a1)/2;
      const tx=r+(r*.65)*Math.sin(mid), ty=r-(r*.65)*Math.cos(mid);
      svg += '<text x="'+tx+'" y="'+ty+'" fill="#fff" font-size="13" font-weight="800" text-anchor="middle" transform="rotate('+(mid*180/Math.PI)+' '+tx+' '+ty+')">'+segments[i].label+'</text>';
    }
    svg += '</svg>';
    return svg;
  }
  let currentRotation=0;
  function render(){
    stage.innerHTML =
      '<div class="game-card-stage">'+
        '<div class="wheel-wrap">'+
          '<div style="position:relative">'+
            '<div style="position:absolute;top:-6px;left:50%;transform:translateX(-50%);font-size:28px;z-index:2">🔻</div>'+
            '<div class="wheel-canvas" id="wheel-svg">'+draw(currentRotation)+'</div>'+
          '</div>'+
          '<button class="btn big" id="wheel-spin">סובב את הגלגל 🎡</button>'+
          '<div id="wheel-result" style="min-height:40px"></div>'+
        '</div>'+
      '</div>';
    stage.querySelector('#wheel-spin').addEventListener('click', spin);
  }
  function spin(){
    if(spinning) return; spinning=true;
    const n=segments.length; const a=360/n;
    const targetIndex = ri(0,n-1);
    const extraTurns = 4+ri(0,2);
    const targetAngle = 360*extraTurns + (360 - (targetIndex*a + a/2)) ;
    currentRotation += targetAngle;
    stage.querySelector('#wheel-svg').innerHTML = draw(currentRotation);
    Sound.click();
    setTimeout(()=>{
      spinning=false;
      const seg = segments[targetIndex];
      const result = document.getElementById('wheel-result');
      if(!result) return;
      const q = seg.generator ? seg.generator() : null;
      if(q){
        result.innerHTML = '<div class="q-prompt" style="font-size:24px">'+q.prompt+'</div>'+
          '<button class="btn" id="wheel-reveal">חשוף תשובה</button><div class="feedback" id="wheel-fb"></div>';
        document.getElementById('wheel-reveal').addEventListener('click', ()=>{
          document.getElementById('wheel-fb').innerHTML = 'התשובה: '+ltr(q.answer)+(q.explain?'<div class="explain">'+q.explain+'</div>':'');
          Sound.correct(); if(State.settings.fx) Confetti.burst();
        });
      } else {
        result.innerHTML = '<div class="q-prompt">'+seg.label+'!</div>';
        Sound.win();
      }
    }, 2250);
  }
  render();
  return function unmount(){ destroyed=true; };
}

/* =========================================================================
   CONTENT GENERATORS — שאלות נכונות מתמטית, לפי נושא ורמה
   כל פונקציה מחזירה { prompt, answer, choices?, explain?, isTrueFalse?, displayAnswer? }
   ========================================================================= */
const CG = {};

function mcqFromAnswer(promptHtml, answer, distractorFn, n, explain){
  const ansStr = String(answer);
  const set = new Set([ansStr]);
  let guard=0;
  while(set.size < n && guard<80){
    const d = String(distractorFn());
    if(d !== ansStr) set.add(d);
    guard++;
  }
  return { prompt: promptHtml, answer: ansStr, choices: Array.from(set), explain };
}

/* ---- חיבור / חיסור ---- */
/* Range params are scaled by the global difficulty level INSIDE the        */
/* generator body (factories run once at CURRICULUM definition — the level  */
/* must be read per-question, not captured).                                */
CG.addSub = (max, allowSub=true) => () => {
  const M = scaleRange(max);
  const a=ri(1,M), b=ri(1,M);
  const op = allowSub && Math.random()<0.5 ? '−' : '+';
  const ans = op==='+' ? a+b : (a>=b? a-b : b-a);
  const x = op==='+'? a : Math.max(a,b), y = op==='+'? b : Math.min(a,b);
  return mcqFromAnswer(ltr(x+' '+op+' '+y+' = ?'), ans, ()=>Math.max(0,ans+pick([-3,-2,-1,1,2,3])), 4);
};
CG.addSubType = (max, allowSub=true) => () => {
  const M = scaleRange(max);
  const a=ri(1,M), b=ri(1,M);
  const op = allowSub && Math.random()<0.5 ? '−' : '+';
  const ans = op==='+' ? a+b : (a>=b? a-b : b-a);
  const x = op==='+'? a : Math.max(a,b), y = op==='+'? b : Math.min(a,b);
  return { prompt: ltr(x+' '+op+' '+y+' = ?'), answer: ans, displayAnswer: ans };
};

/* ---- כפל / חילוק ---- */
CG.mulTable = (maxFactor=10) => () => {
  const M = scaleRange(maxFactor, 3);
  const a=ri(1,M), b=ri(1,M); const ans=a*b;
  const q = mcqFromAnswer(ltr(a+' × '+b+' = ?'), ans, ()=>Math.max(1,ans+pick([-10,-5,-2,2,5,10])), 4);
  q.check = v => parseFloat(v)===ans;
  return q;
};
CG.mulType = (maxFactor=12) => () => {
  const M = scaleRange(maxFactor, 4);
  const a=ri(2,M), b=ri(2,M);
  return { prompt: ltr(a+' × '+b+' = ?'), answer: a*b, displayAnswer: a*b };
};
CG.divType = (maxFactor=12) => () => {
  const M = scaleRange(maxFactor, 4);
  const b=ri(2,M), ans=ri(2,M), a=b*ans;
  return { prompt: ltr(a+' ÷ '+b+' = ?'), answer: ans, displayAnswer: ans };
};
CG.mulDivMixed = (maxFactor=12) => () => Math.random()<.5 ? CG.mulType(maxFactor)() : CG.divType(maxFactor)();
CG.decimalMulType = () => {
  const whole=ri(1,9), tenth=ri(1,9);
  const dec = whole + tenth/10;
  const mult = ri(2,9);
  const ans = Math.round(dec*mult*10)/10;
  return { prompt: ltr(dec.toFixed(1)+' × '+mult+' = ?'), answer: ans, displayAnswer: ans,
    check: v=> Math.abs(parseFloat(v)-ans)<0.05 };
};

/* ---- מרתון מעורב (כל הכיתות, רמה מתכווננת) ---- */
CG.marathonMixed = (level) => () => {
  const ops = level<=1 ? ['+','-'] : level===2 ? ['+','-','×'] : ['+','-','×','÷'];
  const op = pick(ops);
  let a,b,ans,prompt;
  const max = level<=1?20: level===2?12:15;
  if(op==='+'){ a=ri(1,max); b=ri(1,max); ans=a+b; prompt=a+' + '+b; }
  else if(op==='-'){ a=ri(1,max); b=ri(1,max); if(a<b)[a,b]=[b,a]; ans=a-b; prompt=a+' − '+b; }
  else if(op==='×'){ a=ri(1,12); b=ri(1,12); ans=a*b; prompt=a+' × '+b; }
  else { b=ri(2,12); ans=ri(2,12); a=b*ans; prompt=a+' ÷ '+b; }
  return { prompt: ltr(prompt+' = ?'), answer: ans, displayAnswer: ans };
};

/* ---- שברים ---- */
CG.fractionVisualMCQ = () => {
  const d=pick([2,3,4,5,6,8]); const n=ri(1,d-1);
  const ans = fmtFrac(d-n,d);
  return mcqFromAnswer('🍕 איזה שבר מהפיצה נשאר אם חולקים אותה ל-'+ltr(d)+' חלקים ואוכלים '+ltr(n)+' מהם?', ans,
    ()=>{ const dd=pick([2,3,4,5,6,8]); const nn=ri(1,dd-1); return fmtFrac(nn,dd); }, 4);
};
CG.fractionAddType = (sameDen=true) => () => {
  const d = pick([2,3,4,5,6,8,10]);
  let n1=ri(1,d-1), n2=ri(1,d-1);

const TRIG_SPECIAL = [0,30,45,60,90,120,135,150,180];
function trigVal(fn, deg){
  const r = deg*Math.PI/180;
  const v = fn==='sin'? Math.sin(r) : fn==='cos'? Math.cos(r) : Math.tan(r);
  return Math.round(v*1000)/1000;
}
CG.trigWheelMCQ = () => {
  const deg = pick(TRIG_SPECIAL); const fn = pick(['sin','cos','tan']);
  if(fn==='tan' && deg===90) return CG.trigWheelMCQ();
  const ans = trigVal(fn, deg);
  const q = mcqFromAnswer(ltr(fn+'('+deg+'°) = ?'), ans, ()=>{
    let dfn,ddeg,dv;
    do{ dfn=pick(['sin','cos','tan']); ddeg=pick(TRIG_SPECIAL); dv=(dfn==='tan'&&ddeg===90)?null:trigVal(dfn,ddeg); }while(dv===null);
    return dv;
  }, 4);
  q.check = v => Math.abs(parseFloat(v)-ans) < 0.02;
  return q;
};

    {id:4,left:'tan θ',right:'sinθ/cosθ'},
    {id:5,left:'1 + tan²θ',right:'1/cos²θ'},
    {id:6,left:'sin(−θ)',right:'−sinθ'},
    {id:7,left:'cos(−θ)',right:'cosθ'},
  ]).slice(0,n);
  return pairs;
};

function toSubscript(n){ const map={'0':'₀','1':'₁','2':'₂','3':'₃','4':'₄','5':'₅','6':'₆','7':'₇','8':'₈','9':'₉'}; return String(n).split('').map(c=>map[c]||c).join(''); }

CG.derivativeProductType = () => {

/* ---- bespoke generic engines needing custom flow ---- */
function mountMarathon(stage, e){
  let destroyed=false; let score=0; let timeLeft=60;
  function tick(){
    const c = stage.closest('.game-screen'); setTimerDisplay(c, timeLeft, timeLeft<=10);
    if(timeLeft<=0){ finish(); return; }
  }
  function nextQ(){
    if(destroyed) return;
    const q = e.config.gen();
    stage.innerHTML =
      '<div class="game-card-stage">'+
        '<div style="font-size:13px;font-weight:800;color:var(--text-soft);margin-bottom:10px">ניקוד: <span class="ltr-num">'+score+'</span></div>'+
        '<div class="q-prompt">'+q.prompt+'</div>'+
        '<div class="type-answer-row"><input type="text" inputmode="decimal" id="mm-input" autocomplete="off"><button class="btn" id="mm-submit">✓</button></div>'+
      '</div>';
    const input = stage.querySelector('#mm-input'); input.focus();
    let answered=false;
    function submit(){
      if(answered || destroyed) return; answered=true;
      const val = (input.value||'').replace(',','.');
      const ok = q.check ? q.check(val) : parseFloat(val)===parseFloat(q.answer);
      if(ok){ score+=10; Sound.correct(); } else { timeLeft=Math.max(0,timeLeft-3); Sound.wrong(); }
      nextQ();
    }
    stage.querySelector('#mm-submit').addEventListener('click', submit);
    input.addEventListener('keydown', ev=>{ if(ev.key==='Enter') submit(); });
  }
  function finish(){
    stage.innerHTML = '<div class="game-card-stage"><div style="font-size:54px">⏱️</div><h2 style="font-size:26px;margin:10px 0">נגמר הזמן!</h2>'+
      '<div style="font-size:18px">ניקוד סופי: <b class="ltr-num">'+score+'</b></div>'+
      '<button class="btn big" id="mm-again" style="margin-top:18px">סבב נוסף</button></div>';
    Sound.win(); if(State.settings.fx) Confetti.burst();
    stage.querySelector('#mm-again').addEventListener('click', ()=>{ score=0; timeLeft=60; startTimer(); nextQ(); });
  }
  let interval=null;
  function startTimer(){
    if(interval) clearInterval(interval);
    interval = setInterval(()=>{ timeLeft--; tick(); if(timeLeft<=0){ clearInterval(interval); finish(); } },1000);
  }
  startTimer(); nextQ();
  return function unmount(){ destroyed=true; if(interval) clearInterval(interval); };
}

function mountMysteryNumber(stage, e){
  let destroyed=false; let min=e.config.min||1, max=e.config.max||100;
  let target=ri(min,max); let guesses=0;
  function render(){
    stage.innerHTML =
      '<div class="game-card-stage">'+
        '<div class="q-prompt">חשבתי על מספר בין '+min+' ל-'+max+'. ניחוש?</div>'+
        '<div class="type-answer-row"><input type="text" inputmode="numeric" id="my-input" autocomplete="off"><button class="btn" id="my-submit">נחש</button></div>'+
        '<div class="feedback" id="my-fb">ניחושים: <span class="ltr-num">'+guesses+'</span></div>'+
      '</div>';
    const input=stage.querySelector('#my-input'); input.focus();
    function submit(){
      const v = parseInt(input.value,10); if(isNaN(v)) return;
      guesses++;
      const fb = stage.querySelector('#my-fb');
      if(v===target){
        Sound.win(); if(State.settings.fx) Confetti.burst();
        fb.className='feedback ok'; fb.textContent='מצאת! המספר היה '+target+' (ב-'+guesses+' ניחושים)';
        setTimeout(()=>{ target=ri(min,max); guesses=0; render(); }, 1800);
      } else {
        Sound.wrong();
        fb.className='feedback bad'; fb.textContent = v<target? 'גבוה יותר! ⬆️' : 'נמוך יותר! ⬇️';
        input.value=''; input.focus();
      }
    }
    stage.querySelector('#my-submit').addEventListener('click', submit);
    input.addEventListener('keydown', ev=>{ if(ev.key==='Enter') submit(); });
  }
  render();
  return function unmount(){ destroyed=true; };
}

      '<div class="grade-header">'+
        '<h2>'+GRADE_LABEL[grade]+' · משחקי כיתה</h2>'+
        '<span class="count-pill">'+list.length+' משחקים</span>'+
      '</div>'+
      '<div class="level-bar">'+
        '<span class="level-label">רמת קושי:</span>'+
        Object.keys(LEVELS).map(k=>(
          '<button class="level-btn'+(State.settings.level===k?' active':'')+'" data-level="'+k+'">'+LEVELS[k].label+'</button>'
        )).join('')+
        '<span class="level-hint">הרמה קובעת את הזמן לכל שאלה ואת גודל המספרים בתרגילים — אפשר להחליף גם באמצע.</span>'+
      '</div>'+
      '<div class="game-grid">'+
        list.map(g=>(
          '<button class="game-card" data-id="'+g.id+'">'+
            '<div class="art" style="background:linear-gradient(135deg,var(--green),var(--blue))">'+
              '<span>'+g.emoji+'</span>'+
            '</div>'+
            '<div class="body">'+
              '<div class="name">'+g.name+'</div>'+
              '<div class="skill">'+g.skill+'</div>'+
            '</div>'+
          '</button>'
        )).join('')+
      '</div>'+
    '</div>';
  container.querySelector('#grid-back').addEventListener('click', ()=> render(screenHome));
  container.querySelector('#grid-settings').addEventListener('click', ()=> openSettingsModal(container, ()=>render(screenGradeGrid)));
  container.querySelectorAll('.level-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      State.settings.level = btn.dataset.level; saveSettings();
      container.querySelectorAll('.level-btn').forEach(b=>b.classList.toggle('active', b.dataset.level===State.settings.level));
    });
  });
  container.querySelectorAll('.game-card').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const entry = list.find(g=>g.id===btn.dataset.id);
      launchGame(entry);
    });
  });
}

function launchGame(entry){
  render(container=>{
    const stage = gameShell(container, {
      title: entry.name, emoji: entry.emoji,
      onExit: ()=>{ if(State.activeUnmount){ try{State.activeUnmount();}catch(e){} State.activeUnmount=null; } render(screenGradeGrid); }
    });
    const mountFn = GAME_ENGINES[entry.engineId];
    if(!mountFn){ stage.innerHTML='<div class="game-card-stage">משחק לא נמצא</div>'; return; }
    State.activeUnmount = mountFn(stage, entry);
  });
}

function openSettingsModal(container, onClose){
  const overlay = document.createElement('div');
  overlay.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;z-index:200;padding:20px;';
  overlay.innerHTML =
    '<div class="setup-card" style="margin:0;max-width:420px;width:100%">'+
      '<h3>הגדרות</h3>'+
      '<div class="setting-row"><span>טיימר לשאלה</span><div class="switch '+(State.settings.timerOn?'on':'')+'" id="m-sw-timer"></div></div>'+
      '<div class="setting-row"><span>אפקטים (קונפטי)</span><div class="switch '+(State.settings.fx?'on':'')+'" id="m-sw-fx"></div></div>'+
      '<div class="setting-row"><span>סאונד</span><div class="switch '+(State.settings.sound?'on':'')+'" id="m-sw-sound"></div></div>'+
      '<button class="btn big" id="m-close" style="width:100%;margin-top:18px">סגור</button>'+
    '</div>';
  document.body.appendChild(overlay);
  overlay.querySelector('#m-sw-timer').addEventListener('click', e=>{ State.settings.timerOn=!State.settings.timerOn; e.target.classList.toggle('on'); saveSettings(); });
  overlay.querySelector('#m-sw-fx').addEventListener('click', e=>{ State.settings.fx=!State.settings.fx; e.target.classList.toggle('on'); saveSettings(); });
  overlay.querySelector('#m-sw-sound').addEventListener('click', e=>{ State.settings.sound=!State.settings.sound; Sound.setEnabled(State.settings.sound); e.target.classList.toggle('on'); saveSettings(); });
  overlay.querySelector('#m-close').addEventListener('click', ()=>{ overlay.remove(); });
  overlay.addEventListener('click', e=>{ if(e.target===overlay) overlay.remove(); });
}

/* ---------------------------------------------------------------------- */
/* Global keyboard shortcuts                                              */
/* ---------------------------------------------------------------------- */
document.addEventListener('keydown', e=>{
  if(e.target.tagName==='INPUT') return;
  if(e.key==='f' || e.key==='F') toggleFullscreen();
  if(e.key==='s' || e.key==='S'){ State.settings.sound=!State.settings.sound; Sound.setEnabled(State.settings.sound); saveSettings();
    const sb=document.getElementById('gs-sound'); if(sb) sb.textContent = State.settings.sound?'🔊':'🔇'; }
  if(e.key==='Escape'){ const exitBtn=document.getElementById('gs-exit'); if(exitBtn) exitBtn.click(); }
});

/* ---------------------------------------------------------------------- */
/* Boot                                                                    */
/* ---------------------------------------------------------------------- */
loadSettings();
render(screenHome);

</script>
</body>
</html>
