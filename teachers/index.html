<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="theme-color" content="#1e40af">
  <title>פורטל המורים | MathBoost</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://math-crm.onrender.com" crossorigin>
  <style>
    :root {
      color-scheme: light;
      font-family: "Heebo", Arial, sans-serif;
      background: #f8fafc;
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
    }

    .portal-frame {
      display: block;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      border: 0;
      background: #f8fafc;
    }

    .loading {
      position: fixed;
      inset: 0;
      z-index: 2;
      display: grid;
      place-items: center;
      padding: 24px;
      color: #0f172a;
      background:
        radial-gradient(circle at 20% 15%, rgba(124, 58, 237, .16), transparent 32%),
        linear-gradient(145deg, #eff6ff, #f8fafc 55%, #f5f3ff);
      transition: opacity .25s ease, visibility .25s ease;
    }

    .loading.is-hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .loading-card {
      width: min(420px, 100%);
      padding: 34px 28px;
      text-align: center;
      border: 1px solid rgba(148, 163, 184, .28);
      border-radius: 24px;
      background: rgba(255, 255, 255, .88);
      box-shadow: 0 24px 70px rgba(30, 64, 175, .14);
      backdrop-filter: blur(12px);
    }

    .brand {
      font-size: 26px;
      font-weight: 900;
      color: #1e3a8a;
      letter-spacing: -.02em;
    }

    .subtitle {
      margin-top: 5px;
      color: #64748b;
      font-size: 15px;
      font-weight: 600;
    }

    .spinner {
      width: 38px;
      height: 38px;
      margin: 24px auto 0;
      border: 4px solid #dbeafe;
      border-top-color: #4f46e5;
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    @media (prefers-reduced-motion: reduce) {
      .spinner { animation-duration: 1.6s; }
      .loading { transition: none; }
    }
  </style>
</head>
<body>
  <div id="loading" class="loading" role="status" aria-live="polite">
    <div class="loading-card">
      <div class="brand">MathBoost</div>
      <div class="subtitle">פורטל המורים נטען כעת</div>
      <div class="spinner" aria-hidden="true"></div>
    </div>
  </div>

  <iframe
    id="teacher-portal"
    class="portal-frame"
    src="https://math-crm.onrender.com/lesson-builder"
    title="פורטל המורים של MathBoost"
    allow="clipboard-read; clipboard-write"
    referrerpolicy="strict-origin"
  ></iframe>

  <script>
    const frame = document.getElementById('teacher-portal');
    const loading = document.getElementById('loading');
    frame.addEventListener('load', () => loading.classList.add('is-hidden'), { once: true });
  </script>
</body>
</html>
